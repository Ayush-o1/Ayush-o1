<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="Fifteen concurrent booking requests hit a session with one seat. A row lock lets exactly one through, which commits with 201 Created; the remaining fourteen queue at the lock and are rejected with 409 Conflict. The seat counter falls from one to zero."><title>prove_concurrency: fifteen requests, one seat</title><style><![CDATA[.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.lb{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#8b949e}]]></style><rect x="0.5" y="0.5" width="999" height="399" rx="14" fill="#0d1117" stroke="#30363d"/><text class="m" x="36" y="48" font-size="15" fill="#8b949e"><tspan fill="#3fb950">$</tspan> python manage.py prove_concurrency <tspan fill="#e6edf3">--contenders 15</tspan></text><line x1="36" y1="70" x2="964" y2="70" stroke="#30363d"/><text class="s lb" x="36" y="106">15 CONCURRENT</text><text class="s lb" x="360" y="106">ONE SEAT</text><text class="s lb" x="760" y="106">RESULT</text><circle cx="52" cy="150" r="10" fill="none" stroke="#30363d" stroke-width="1.5"/><circle cx="92" cy="150" r="10" fill="none" stroke="#30363d" stroke-width="1.5"/><circle cx="132" cy="150" r="10" fill="none" stroke="#30363d" stroke-width="1.5"/><circle cx="52" cy="195" r="10" fill="none" stroke="#30363d" stroke-width="1.5"/><circle cx="92" cy="195" r="10" fill="none" stroke="#30363d" stroke-width="1.5"/><circle cx="132" cy="195" r="10" fill="none" stroke="#30363d" stroke-width="1.5"/><circle cx="52" cy="240" r="10" fill="none" stroke="#30363d" stroke-width="1.5"/><circle cx="92" cy="240" r="10" fill="none" stroke="#30363d" stroke-width="1.5"/><circle cx="132" cy="240" r="10" fill="none" stroke="#30363d" stroke-width="1.5"/><circle cx="52" cy="285" r="10" fill="none" stroke="#30363d" stroke-width="1.5"/><circle cx="92" cy="285" r="10" fill="none" stroke="#30363d" stroke-width="1.5"/><circle cx="132" cy="285" r="10" fill="none" stroke="#30363d" stroke-width="1.5"/><circle cx="52" cy="330" r="10" fill="none" stroke="#30363d" stroke-width="1.5"/><circle cx="92" cy="330" r="10" fill="none" stroke="#30363d" stroke-width="1.5"/><circle cx="132" cy="330" r="10" fill="none" stroke="#30363d" stroke-width="1.5"/><rect x="360" y="140" width="280" height="200" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1.5"/><text class="s lb" x="500" y="184" text-anchor="middle">SEATS LEFT</text><text class="m" x="500" y="290" font-size="90" font-weight="700" text-anchor="middle" fill="#e6edf3">0</text><text class="m" x="500" y="368" font-size="13" fill="#8b949e" text-anchor="middle">SELECT … FOR UPDATE</text><circle cx="735" cy="240" r="10" fill="#3fb950"/><circle cx="350" cy="150" r="9" fill="#f85149" opacity="0.5"/><circle cx="350" cy="195" r="9" fill="#f85149" opacity="0.5"/><circle cx="350" cy="240" r="9" fill="#f85149" opacity="0.5"/><circle cx="350" cy="285" r="9" fill="#f85149" opacity="0.5"/><circle cx="350" cy="330" r="9" fill="#f85149" opacity="0.5"/><circle cx="334" cy="150" r="9" fill="#f85149" opacity="0.5"/><circle cx="334" cy="195" r="9" fill="#f85149" opacity="0.5"/><circle cx="334" cy="285" r="9" fill="#f85149" opacity="0.5"/><circle cx="334" cy="330" r="9" fill="#f85149" opacity="0.5"/><circle cx="318" cy="150" r="9" fill="#f85149" opacity="0.5"/><circle cx="318" cy="195" r="9" fill="#f85149" opacity="0.5"/><circle cx="318" cy="240" r="9" fill="#f85149" opacity="0.5"/><circle cx="318" cy="285" r="9" fill="#f85149" opacity="0.5"/><circle cx="318" cy="330" r="9" fill="#f85149" opacity="0.5"/><text class="m" x="760" y="252" font-size="46" font-weight="700" fill="#3fb950">1</text><text class="m" x="760" y="330" font-size="46" font-weight="700" fill="#f85149">14</text><text class="s lb" x="760" y="274">COMMITTED · 201</text><text class="s lb" x="760" y="352">REJECTED · 409</text></svg>