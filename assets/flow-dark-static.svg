<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="A request moves through four stages: a client built with React, Next.js and TanStack Query; an API in Express, FastAPI or Django; async work on BullMQ, Redis and Socket.IO; and data in PostgreSQL via Prisma, or Neo4j. The response returns to the client. Docker, GitHub Actions, pytest, Vitest, Turborepo and C++ for DSA sit around all of it."><title>Request in, response out — the usual shape</title><style><![CDATA[.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace}.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}]]></style><rect x="0.5" y="0.5" width="999" height="279" rx="14" fill="#0d1117" stroke="#30363d"/><line x1="238" y1="112.0" x2="274" y2="112.0" stroke="#21262d" stroke-width="1.5"/><line x1="482" y1="112.0" x2="518" y2="112.0" stroke="#21262d" stroke-width="1.5"/><line x1="726" y1="112.0" x2="762" y2="112.0" stroke="#21262d" stroke-width="1.5"/><path d="M866.0 168 V206 H134.0 V168" fill="none" stroke="#21262d" stroke-width="1.5"/><text class="m" x="500" y="228" font-size="12" fill="#8b949e" text-anchor="middle">response</text><rect x="30" y="56" width="208" height="112" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/><text class="s" x="48" y="82" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#8b949e">CLIENT</text><text class="m" x="48" y="108" font-size="14.5" fill="#e6edf3">React</text><text class="m" x="48" y="130" font-size="14.5" fill="#e6edf3">Next.js</text><text class="m" x="48" y="152" font-size="14.5" fill="#e6edf3">TanStack Query</text><rect x="274" y="56" width="208" height="112" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/><text class="s" x="292" y="82" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#8b949e">API</text><text class="m" x="292" y="108" font-size="14.5" fill="#e6edf3">Express</text><text class="m" x="292" y="130" font-size="14.5" fill="#e6edf3">FastAPI</text><text class="m" x="292" y="152" font-size="14.5" fill="#e6edf3">Django</text><rect x="518" y="56" width="208" height="112" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/><text class="s" x="536" y="82" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#8b949e">ASYNC</text><text class="m" x="536" y="108" font-size="14.5" fill="#e6edf3">BullMQ</text><text class="m" x="536" y="130" font-size="14.5" fill="#e6edf3">Redis</text><text class="m" x="536" y="152" font-size="14.5" fill="#e6edf3">Socket.IO</text><rect x="762" y="56" width="208" height="112" rx="10" fill="none" stroke="#30363d" stroke-width="1.5"/><text class="s" x="780" y="82" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#8b949e">DATA</text><text class="m" x="780" y="108" font-size="14.5" fill="#e6edf3">PostgreSQL</text><text class="m" x="780" y="130" font-size="14.5" fill="#e6edf3">Prisma</text><text class="m" x="780" y="152" font-size="14.5" fill="#e6edf3">Neo4j</text><line x1="30" y1="242" x2="970" y2="242" stroke="#21262d"/><text class="m" x="30" y="266" font-size="12.5" fill="#8b949e">Docker &#183; GitHub Actions &#183; pytest &#183; Vitest &#183; Turborepo &#183; C++ for DSA</text></svg>