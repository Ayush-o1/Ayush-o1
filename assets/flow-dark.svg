<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 212" width="1200" height="212" role="img" aria-label="The shape of a typical system: a client built with React, Next.js and TanStack Query calls an API built with Express, FastAPI or Django; work that should not block a request goes to BullMQ, Redis and Socket.IO; data sits in PostgreSQL via Prisma, or Neo4j. Docker, GitHub Actions, pytest, Vitest and Turborepo sit around all of it."><title>The shape of what I build</title><rect x="0.5" y="0.5" width="1199" height="211" rx="12" fill="#0d1117" stroke="#30363d"/><line x1="292.0" y1="106.0" x2="336.0" y2="106.0" stroke="#30363d" stroke-width="1.5"/><circle r="4" cy="106.0" fill="#58a6ff" opacity="0"><animate attributeName="cx" dur="5.0s" repeatCount="indefinite" values="292.0;292.0;336.0;336.0" keyTimes="0.0000;0.1500;0.2800;1.0000"/><animate attributeName="opacity" dur="5.0s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0.0000;0.1500;0.2700;0.2800;1.0000"/></circle><line x1="588.0" y1="106.0" x2="632.0" y2="106.0" stroke="#30363d" stroke-width="1.5"/><circle r="4" cy="106.0" fill="#58a6ff" opacity="0"><animate attributeName="cx" dur="5.0s" repeatCount="indefinite" values="588.0;588.0;632.0;632.0" keyTimes="0.0000;0.3800;0.5100;1.0000"/><animate attributeName="opacity" dur="5.0s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0.0000;0.3800;0.5000;0.5100;1.0000"/></circle><line x1="884.0" y1="106.0" x2="928.0" y2="106.0" stroke="#30363d" stroke-width="1.5"/><circle r="4" cy="106.0" fill="#58a6ff" opacity="0"><animate attributeName="cx" dur="5.0s" repeatCount="indefinite" values="884.0;884.0;928.0;928.0" keyTimes="0.0000;0.6100;0.7400;1.0000"/><animate attributeName="opacity" dur="5.0s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0.0000;0.6100;0.7300;0.7400;1.0000"/></circle><rect x="40.0" y="52.0" width="252.0" height="108.0" rx="8" fill="none" stroke="#30363d" stroke-width="1.5"/><rect x="40.0" y="52.0" width="252.0" height="108.0" rx="